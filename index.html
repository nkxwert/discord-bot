<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>마코</title>
  <meta name="description" content="마코 디스코드 봇 초대하기">
  <meta name="theme-color" content="#a9bfae">
  <link rel="preload" as="image" href="assets/images/background.webp" type="image/webp">
  <style>
    :root {
      --blue: #5865f2;
      --blue-hover: #4752c4;
      --card: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.85);
      --text: #2f3b33;
      --muted: #5b6b60;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: #dfe8e0;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Blurred background picture. It sits on its own fixed layer so it never scrolls or tiles,
       and is scaled up slightly so the blur doesn't leave soft edges at the screen border. */
    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("assets/images/background.jpg");
      background-image: image-set(url("assets/images/background.webp") type("image/webp"),
                                  url("assets/images/background.jpg") type("image/jpeg"));
      background-size: cover;
      background-position: center 30%;
      filter: blur(6px);
      transform: scale(1.08);
    }
    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.15), rgba(40, 60, 45, 0.25));
    }

    .card {
      width: min(100%, 420px);
      padding: clamp(28px, 7vw, 44px) clamp(20px, 6vw, 40px);
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(40, 60, 45, 0.18);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    .avatar {
      width: clamp(120px, 40vw, 160px);
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.6rem, 6vw, 2rem);
      line-height: 1.2;
    }

    .invite {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 14px 24px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .invite svg { width: 24px; height: 24px; flex: none; }
    .invite:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .invite:active { transform: translateY(1px); }
    .invite:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    footer {
      margin-top: 20px;
      font-size: 0.85rem;
      text-align: center;
    }
    footer a {
      color: var(--text);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
    }
    footer a:hover { text-decoration: underline; }
    footer span { margin: 0 4px; color: var(--muted); }

    /* Short screens (a phone held sideways): shrink the card so the button stays on screen. */
    @media (max-height: 520px) {
      body { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .card { padding: 20px 28px; }
      .avatar { width: 96px; margin-bottom: 8px; }
      h1 { font-size: 1.4rem; margin-bottom: 16px; }
      footer { margin-top: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .invite { transition: none; }
      .invite:hover, .invite:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <main class="card">
    <picture>
      <source srcset="assets/images/avatar.webp" type="image/webp">
      <img class="avatar" src="assets/images/avatar.png" width="512" height="512" alt="마코">
    </picture>
    <h1>마코입니다</h1>
    <a class="invite" href="https://discord.com/oauth2/authorize?client_id=1561618276763570186&amp;permissions=8515702525262144&amp;integration_type=0&amp;scope=bot%20applications.commands">

      Discord에 초대하기
    </a>
  </main>

  <footer>
    <a href="terms.html">이용 약관</a><span>·</span><a href="privacy.html">개인정보 보호 정책</a>
  </footer>
</body>
</html>
