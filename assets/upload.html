<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="maco-upload-page" content="6">
<title>마코 파일 올리기</title>
<style>
  :root { --bg: #eef3ee; --card: #ffffff; --text: #2f3b33; --muted: #5b6b60; --accent: #7f9c86; --accent-dark: #5f7d67; --bar: #dfe8e0; --error: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b211d; --card: #252d27; --text: #e6ede7; --muted: #a7b5aa; --accent: #8fae96; --accent-dark: #a9c4ae; --bar: #3a463d; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { width: min(100%, 440px); background: var(--card); border-radius: 20px; padding: 28px 24px; box-shadow: 0 12px 32px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 1.4rem; }
  p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; font-size: .95rem; }
  label.pick { display: block; border: 2px dashed var(--accent); border-radius: 14px; padding: 24px 12px; text-align: center; cursor: pointer; word-break: break-all; }
  input[type=file] { display: none; }
  button { width: 100%; margin-top: 16px; min-height: 48px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 10px; background: var(--bar); border-radius: 999px; overflow: hidden; margin-top: 16px; display: none; }
  .bar div { height: 100%; width: 0; background: var(--accent-dark); transition: width .2s; }
  #status { margin-top: 12px; min-height: 1.5em; font-size: .95rem; white-space: pre-line; word-break: break-word; }
  .error { color: var(--error); }
  .notice { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .notice.open { display: flex; }
  .notice div { width: min(100%, 380px); background: var(--card); border-radius: 18px; padding: 22px 20px; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .notice h2 { margin: 0 0 12px; font-size: 1.15rem; }
  .notice ul { margin: 0 0 14px; padding-left: 20px; line-height: 1.7; }
  .notice label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .95rem; cursor: pointer; }
  .notice button { margin-top: 14px; }
  .done { text-align: center; font-size: 1.05rem; }
</style>
</head>
<body>
<main>
  <h1>마코 파일 올리기</h1>
  <label class="pick" for="file" id="pick">눌러서 파일 고르기</label>
  <input type="file" id="file">
  <button id="send" disabled>올리기</button>
  <div class="bar" id="bar"><div></div></div>
  <div id="status" role="status"></div>
</main>
<div class="notice" id="notice" role="dialog" aria-modal="true" aria-labelledby="notice-title">
  <div>
    <h2 id="notice-title">📦 업로드 전에 확인해 주세요</h2>
    <ul>
      <li>올린 파일은 <strong><span id="retention">7일</span> 후 자동으로 삭제</strong>됩니다.</li>
      <li>링크가 있으면 누구나 볼 수 있습니다.</li>
      <li>개인정보가 담긴 파일은 올리지 마세요.</li>
    </ul>
    <label><input type="checkbox" id="hide-notice"> 다시 보지 않기</label>
    <button id="notice-ok">확인</button>
  </div>
</div>
<script>
  // The #fragment holds where to upload and the retention, joined with "!":
  //   "b2!<upload URL>!<token>!<file key>!<retention>"  Backblaze's native browser upload
  //   "<presigned PUT URL>!<retention>"                  any S3 storage
  // Older links used "|" (which Discord rewrites to "%7C") and "b2:" + base64 JSON; both still work.
  function decodeFully(text) {
    for (let i = 0; i < 3 && /%[0-9a-f]{2}/i.test(text); i++) {
      try { const next = decodeURIComponent(text); if (next === text) break; text = next; } catch (e) { break; }
    }
    return text;
  }
  let hash = location.hash.slice(1);
  if (/^(b2|https?)%(3A|21)/i.test(hash) || /^b2%21/i.test(hash)) hash = decodeFully(hash);  // whole fragment encoded
  hash = hash.replace(/%25(7C|21)/gi, "%$1").replace(/%7C/gi, "|").replace(/%21/g, "!");
  // An optional last part is the bot's signal address (NKOTE): the page reports "started"/"done" there so
  // the bot can post the file seconds after the upload ends.
  let target = "", retention = "", native = null, signalUrl = "";
  if (hash.startsWith("b2!")) {
    const parts = hash.split("!").map(decodeFully);
    native = {u: parts[1], t: parts[2], k: parts[3]};
    retention = parts[4] || "";
    signalUrl = parts[5] || "";
  } else {
    const parts = hash.split(/[!|]/);
    target = decodeFully(parts[0] || "");
    retention = decodeFully(parts[1] || "");
    signalUrl = decodeFully(parts[2] || "");
    if (target.startsWith("b2:")) {  // older native format
      try { native = JSON.parse(atob(target.slice(3).replace(/-/g, "+").replace(/_/g, "/"))); } catch (e) { native = null; }
    }
  }
  const usable = native ? native.u && native.u.startsWith("https://") : target.startsWith("https://");
  if (retention) document.getElementById("retention").textContent = retention;

  // First-visit notice, with "다시 보지 않기" remembered in this browser.
  const NOTICE_KEY = "maco-upload-notice-hidden";
  const notice = document.getElementById("notice");
  let noticeHidden = false;
  try { noticeHidden = localStorage.getItem(NOTICE_KEY) === "1"; } catch (e) {}
  if (!noticeHidden) notice.classList.add("open");
  document.getElementById("notice-ok").addEventListener("click", () => {
    if (document.getElementById("hide-notice").checked) {
      try { localStorage.setItem(NOTICE_KEY, "1"); } catch (e) {}
    }
    notice.classList.remove("open");
  });

  function signal(state) {
    if (!/^https:\/\//.test(signalUrl)) return;
    try {
      fetch(signalUrl, {method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({state}), keepalive: true, mode: "cors"}).catch(() => {});
    } catch (e) {}
  }
  const fileInput = document.getElementById("file");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  function say(text, isError) { status.textContent = text; status.className = isError ? "error" : ""; }
  if (!usable) {
    say("올바른 업로드 링크가 아닙니다. 디스코드에서 다시 링크를 받아 주세요.", true);
  }
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    document.getElementById("pick").textContent = file ? file.name : "눌러서 파일 고르기";
    send.disabled = !file || !usable;
  });
  // Attempts, in order: with the file-name header; without it; the file read into one fixed-size block
  // (some mobile / in-app browsers stream a picked file without stating its size, which storage refuses).
  const ATTEMPTS = [{name: true, block: false}, {name: false, block: false}, {name: false, block: true}];
  const BLOCK_LIMIT = 200 * 1024 * 1024;
  const failures = [];

  async function upload(file, attempt) {
    const plan = ATTEMPTS[attempt];
    let body = file;
    if (plan.block) {
      if (file.size > BLOCK_LIMIT) return fail(file, null);
      say("다른 방법으로 다시 올리는 중...");
      try { body = new Uint8Array(await file.arrayBuffer()); } catch (e) { return fail(file, null); }
    }
    const request = new XMLHttpRequest();
    const disposition = "attachment; filename*=UTF-8''" + encodeURIComponent(file.name);
    if (native) {
      request.open("POST", native.u);
      request.setRequestHeader("Authorization", native.t);
      request.setRequestHeader("X-Bz-File-Name", native.k.split("/").map(encodeURIComponent).join("/"));
      request.setRequestHeader("Content-Type", file.type || "b2/x-auto");
      request.setRequestHeader("X-Bz-Content-Sha1", "do_not_verify");
      if (plan.name) request.setRequestHeader("X-Bz-Info-b2-content-disposition", encodeURIComponent(disposition));
    } else {
      request.open("PUT", target);
      request.setRequestHeader("Content-Type", file.type || "application/octet-stream");
      if (plan.name) request.setRequestHeader("Content-Disposition", disposition);
    }
    request.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round(e.loaded / e.total * 100);
        bar.firstElementChild.style.width = percent + "%";
        say(percent + "% 올리는 중...");
      }
    };
    request.onload = () => {
      if (request.status >= 200 && request.status < 300) {
        bar.firstElementChild.style.width = "100%";
        signal("done");
        finished();
        return;
      }
      const code = errorCode(request.responseText || "");
      failures.push("#" + (attempt + 1) + " HTTP " + request.status + (code ? " " + code : ""));
      if ((request.status === 400 || request.status === 403) && attempt + 1 < ATTEMPTS.length
          && code !== "RequestExpired" && code !== "expired_auth_token") {
        bar.firstElementChild.style.width = "0";
        upload(file, attempt + 1);
        return;
      }
      fail(file, request);
    };
    request.onerror = () => {
      failures.push("#" + (attempt + 1) + " 연결 실패");
      say("올리지 못했습니다. 인터넷 연결을 확인하고 디스코드에서 링크를 다시 받아 주세요.", true);
    };
    request.send(body);
  }

  // S3 answers XML (<Code>, <Message>), B2's native API answers JSON ({code, message}).
  function errorCode(text) {
    try { return JSON.parse(text).code; } catch (e) { return (/<Code>([^<]+)<\/Code>/.exec(text) || [])[1]; }
  }
  function errorMessage(text) {
    try { return JSON.parse(text).message; } catch (e) { return (/<Message>([^<]*)<\/Message>/.exec(text) || [])[1]; }
  }

  // Done: tell the user to go back, and close the tab if the browser lets the page do that
  // (tabs opened from a link often can't be closed by script; then the message stays).
  function finished() {
    document.querySelector("main").innerHTML =
      '<h1>✅ 업로드 완료!</h1><p class="done">디스코드로 돌아가 주세요.<br>채널에 곧 파일이 올라갑니다.</p>';
    setTimeout(() => { try { window.close(); } catch (e) {} }, 1500);
  }

  function fail(file, request) {
    const text = request ? request.responseText || "" : "";
    const code = errorCode(text);
    const detail = errorMessage(text);
    const reason = code === "AccessDenied" || code === "SignatureDoesNotMatch" || code === "RequestExpired" || code === "expired_auth_token" || code === "bad_auth_token"
      ? "링크가 만료되었거나 올바르지 않습니다(10분)." : "저장소가 업로드를 거절했습니다.";
    const browser = (navigator.userAgent.match(/(Discord|KAKAOTALK|Instagram|Line|SamsungBrowser|Edg|OPR|Chrome|CriOS|Firefox|FxiOS|Safari)[\/ ][\d.]+/g) || []).join(" ");
    say(reason + " 디스코드에서 링크를 다시 받아 주세요.\n"
        + "(오류: " + (request ? "HTTP " + request.status + (code ? " " + code : "") + (detail ? " — " + detail : "") : "재시도 불가")
        + " · 시도 " + failures.join(", ")
        + " · 파일 " + Math.round(file.size / 1024) + "KB " + (file.type || "형식 없음")
        + " · " + (browser || "브라우저 알 수 없음") + ")", true);
  }

  send.addEventListener("click", () => {
    const file = fileInput.files[0];
    if (!file) return;
    send.disabled = true;
    fileInput.disabled = true;
    bar.style.display = "block";
    signal("started");
    upload(file, 0);
  });
</script>
</body>
</html>
